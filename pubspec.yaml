name: remindme
description: "RemindMe AI - An AI-powered personal assistant for neurodivergent individuals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.2
  geolocator: ^13.0.2
  google_maps_flutter: ^2.12.1
  flutter_local_notifications: ^18.0.1
  http: ^1.3.0
  provider: ^6.1.5
  intl: ^0.20.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
